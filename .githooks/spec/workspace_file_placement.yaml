ignore_paths:
  - ".wt/"
  - ".githooks/"
  - "node_modules/"
  - "target/"
  - "__pycache__/"
  - ".git/"
  - ".benchmarks/"
  - ".pytest_cache/"
  - "vendor/"
  - "apps/web/dist"
  - "apps/api/web/dist"

forbidden_patterns:
  - path_regex: 'apps/web/src/.*\.md$'
    reason: "documentation .md inside frontend src/"
    suggestion: "move to docs/ or repository root"
    severity: WARN

expected_locations:
  - file_pattern: 'test_.*\.py$'
    expected_dir: ".githooks/tests/"
