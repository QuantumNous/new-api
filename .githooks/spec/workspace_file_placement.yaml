ignore_paths:
  - ".wt/"
  - ".githooks/"
  - "node_modules/"
  - "target/"
  - "__pycache__/"
  - ".git/"
  - ".benchmarks/"
  - ".pytest_cache/"

forbidden_patterns:
  - path_regex: 'src/.*_test\.rs$'
    reason: "rust test file in src/ alongside source code"
    suggestion: "move to tests/ or crates/<name>/tests/"
    severity: WARN
  - path_regex: 'src/.*\.md$'
    reason: "documentation .md inside src/ (unless module README)"
    suggestion: "move to docs/ or repository root"
    severity: WARN

expected_locations:
  - file_pattern: 'test_.*\.py$'
    expected_dir: "tests/"
  - file_pattern: '.*\.sh$'
    expected_dir: "bin/"
