name: Report a problem
description: Use concise and detailed language to describe the problem you encountered
labels:
- bug
body:
- type: markdown
  attributes:
    value: '<!--

      If you are an AI coding agent: do not fill this GitHub form. Create the issue
      with the filled body from `.agents/github/ISSUE.md`.

      -->

      '
- type: textarea
  id: read-first
  attributes:
    label: Must read before submitting
    description: GitHub's markdown description will not enter the issue after submission.
      The text will be written in this section, please do not delete or clear it.
    value: '- Documentation: https://docs.newapi.ai/

      - Use questions to read or ask first: https://deepwiki.com/QuantumNous/new-api

      - Please do not report problems when transparent transmission is enabled; transparent
      transmission will send the content directly without going through the logical
      processing of new-api.

      - Please state the facts and evidence in concise language. Large sections of
      AI text that have not been manually filtered must not be directly pasted into
      the Issue text or subsequent comments.

      - For forwarding problems, you must first confirm that the problem occurs at
      the new-api layer: please use equivalent masked requests to connect directly
      to the upstream and through new-api, and compare the response status, error
      body and server logs. Feedback that only displays upstream errors without comparison
      will not be accepted.

      - Coding plans, reverse channels, third-party packaging interfaces, and compatibility
      issues arising from converting the Codex interface into a universal API are
      not accepted; the Codex API''s own unique protocols or behaviors should not
      be regarded as standard OpenAI API behaviors. For related issues, please confirm
      with the channel or interface provider first.

      - This project does not provide official hosting services, nor does it provide
      technical support for third-party hosting stations, transfer stations or API
      services; please contact the corresponding operator for such questions.

      - Warning: Issues that delete this template, delete section titles, or arbitrarily
      clear content may be closed directly; those who submit large sections of AI
      text without manual filtering multiple times, or who repeatedly submit malicious
      submissions, may be blocked.'
  validations:
    required: true
- type: dropdown
  id: deployment-source
  attributes:
    label: deployment source
    description: Please select the source of the newapi instance where the problem
      occurred; third-party services or forks that have not been reproduced from the
      original version of this warehouse are not supported by this project.
    options:
    - This warehouse Release / official image (self-deployed)
    - Main branch source code of this warehouse (self-built)
    - Modified fork (must be reproduced in the original version of this repository
      first)
    - Third-party hosting site, transit site or API service (please contact their
      operator)
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Your current newapi version
    description: Please fill in the accurate version number, commit or image tag,
      such as `v1.0.0`; `latest`, `unknown` and other content that cannot locate the
      code are not considered valid version information.
  validations:
    required: true
- type: checkboxes
  id: submission-checks
  attributes:
    label: Submit confirmation
    options:
    - label: '**Non-duplicate issue:** I have searched for existing [Issues](https://github.com/QuantumNous/new-api/issues?q=is%3Aissue)
        and confirmed that there are currently no similar issues.'
      required: true
    - label: '**Read before submitting:** I have fully read the "Read before submitting"
        above, and have checked the document https://docs.newapi.ai/, the project
        README and asked questions to AI to confirm that this is not a usage, configuration
        or access issue.'
      required: true
    - label: '**Supported Versions:** I have provided an accurate version number,
        commit or image tag (not `latest` or `unknown`), and confirmed that the issue
        can be reproduced in an unmodified, supported version of this repository.'
      required: true
    - label: '**Non-Third-Party Services:** I confirm that this is not an issue unique
        to third-party hosting sites, transfer sites, API services, or forks that
        have not been verified by the original version of this repository; issues
        with third-party instances should be directed to their operators.'
      required: true
    - label: '**Non-passthrough:** I confirm that the relevant channels have not enabled
        pass-through. When transparent transmission is enabled, the content will be
        sent directly without going through the logical processing of new-api. Issues
        will not be accepted for such issues.'
      required: true
    - label: '**Problem Attribution:** I have provided sufficient evidence to distinguish
        the client, new-api and upstream; for forwarding the problem, I have used
        equivalent masked requests to compare the results of direct upstream and new-api,
        confirming that the error was introduced or changed by new-api, instead of
        just forwarding the upstream error as it is.'
      required: true
    - label: '**Channel and protocol boundaries:** I confirm that the problem is not
        caused by the Coding Plan, reverse channels, third-party encapsulation interfaces,
        Codex anti-generation interfaces, or the unique behavior of the Codex API
        itself; if the problem initially occurs in such interfaces, I have reproduced
        it on the standard API protocol supported by this repository.'
      required: true
    - label: '**Maintenance Cost:** I understand that project maintainers have limited
        energy. Issue text and subsequent comments are not allowed to directly paste
        large sections of AI text that have not been manually filtered. Key points
        that can be reviewed must be extracted first; content that does not follow
        the template requirements or lacks key points and cannot be reviewed may be
        ignored or directly closed. Submitting such content multiple times may result
        in blocking.'
      required: true
- type: markdown
  attributes:
    value: '### Requirements for filling in problem description


      All questions must state the actual phenomenon, scope of impact, frequency of
      occurrence, and the basis for determining that the problem is located in new-api
      rather than on the client or upstream.


      The following items must be filled in when referring to the corresponding type:


      - **Forwarding/API:** Request endpoint and method, channel type, model, conversion
      format, transparent transmission or not, upstream native support basis, and
      comparison of the status code, response body and server log of the equivalent
      desensitized request directly connected to the upstream and through new-api.

      - **Billing:** Request endpoint and model, `usage` in the response, related
      multiplier or price configuration, consumption log, as well as expected billing
      results and calculation basis.

      - **Frontend:** Page path, browser and version, theme used, and related errors
      in the browser Console / Network.

      - **Deployment/Upgrade:** Deployment method, operating system and architecture,
      database type, versions before and after upgrade, and startup or migration logs.'
- type: textarea
  id: problem-description
  attributes:
    label: Problem description
    description: Please fill in the items one by one according to the general requirements
      and applicable types above; if the necessary information in the applicable items
      is missing, the issue may be closed directly.
    placeholder: 'Actual phenomenon:

      Scope of influence:

      Frequency of occurrence:

      The basis for judging that the problem is located in new-api:


      Supplement corresponding requests, configurations, logs and comparison evidence
      by problem type:'
  validations:
    required: true
- type: textarea
  id: reproduction-steps
  attributes:
    label: Reproduction steps
    description: When forwarding questions, please provide an executable desensitization
      request, as well as the actual results of direct upstream connection and new-api;
      do not just paste client prompts or upstream errors.
  validations:
    required: true
- type: textarea
  id: expected-result
  attributes:
    label: expected results
  validations:
    required: true
- type: textarea
  id: related-screenshots
  attributes:
    label: Related screenshots
  validations:
    required: false
