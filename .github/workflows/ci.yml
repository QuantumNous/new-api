name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      SINGBOX_TAGS: 'with_gvisor,with_wireguard,with_utls'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/api/modules/relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p apps/api/web/dist
          touch apps/api/web/dist/index.html

      - name: Vet api module
        working-directory: apps/api
        run: go vet -tags "${SINGBOX_TAGS}" ./...

      - name: Vet relaykit independently
        working-directory: apps/api/modules/relaykit
        run: go vet ./...

      - name: Build api module
        working-directory: apps/api
        run: go build -tags "${SINGBOX_TAGS}" ./...

      - name: Build relaykit independently
        working-directory: apps/api/modules/relaykit
        run: go build ./...

      - name: Test api module
        working-directory: apps/api
        run: GOWORK=off go test -tags "${SINGBOX_TAGS}" ./...

      - name: Race-detect client-ban + insight hot paths
        working-directory: apps/api
        run: GOWORK=off go test -tags "${SINGBOX_TAGS}" -race -run 'ClientBan|ResolveClient|GatewayRelayHeaders' ./internal/usage/ ./internal/transport/middleware/

      - name: Fresh-web sensitive eval matrix (verbose)
        if: always()
        working-directory: apps/api
        run: GOWORK=off go test -tags "${SINGBOX_TAGS}" -v -run 'TestSensitiveEvalFresh' ./internal/sensitive/

      - name: Test relaykit module
        working-directory: apps/api/modules/relaykit
        run: GOWORK=off go test ./...

      - name: Build executable for isolated gateway smoke
        working-directory: apps/api
        run: go build -tags "${SINGBOX_TAGS}" -o "${RUNNER_TEMP}/new-api" .

      - name: Upload gateway smoke executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-smoke-linux-amd64
          path: ${{ runner.temp }}/new-api
          if-no-files-found: error
          retention-days: 3

  # `dev`-tagged code (the local dev auto-login endpoint) is never shipped, but
  # it still has to compile — otherwise it rots unnoticed and only breaks the
  # developer who turns it on. Compile only: no tests, and the tag never reaches
  # a release build.
  backend-dev-tag:
    name: Backend build with dev tag
    if: github.event.action != 'closed' || github.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/api/modules/relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p apps/api/web/dist
          touch apps/api/web/dist/index.html

      - name: Build api module with dev tag
        working-directory: apps/api
        run: go build -tags dev ./...

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install

      - name: Generate route tree
        run: bun run generate:routes

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
