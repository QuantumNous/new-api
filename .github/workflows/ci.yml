name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      SINGBOX_TAGS: 'with_gvisor,with_wireguard,with_utls'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            modules/relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p apps/api/web/dist
          touch apps/api/web/dist/index.html

      - name: Vet api module
        working-directory: apps/api
        run: go vet -tags "${SINGBOX_TAGS}" ./...

      - name: Vet relaykit independently
        working-directory: modules/relaykit
        run: go vet ./...

      - name: Build api module
        working-directory: apps/api
        run: go build -tags "${SINGBOX_TAGS}" ./...

      - name: Build relaykit independently
        working-directory: modules/relaykit
        run: go build ./...

      - name: Test api module
        working-directory: apps/api
        run: GOWORK=off go test -tags "${SINGBOX_TAGS}" ./...

      - name: Test relaykit module
        working-directory: modules/relaykit
        run: GOWORK=off go test ./...

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
