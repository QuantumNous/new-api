name: Deploy to Server (Podman)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要部署的镜像 tag（例如 sha-abc123、latest、insight）"
        required: true
        default: "latest"
        type: string

concurrency:
  group: server-deploy-podman
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server (Podman)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve image tag
        id: resolve_tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Deploying tag: ${TAG}"

      - name: Validate secrets
        run: |
          missing=()
          [ -z "${{ secrets.PROD_SERVER_HOST }}" ] && missing+=("PROD_SERVER_HOST")
          [ -z "${{ secrets.PROD_SERVER_USER }}" ] && missing+=("PROD_SERVER_USER")
          [ -z "${{ secrets.PROD_SERVER_SSH_KEY }}" ] && missing+=("PROD_SERVER_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少必需的 GitHub Secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}
          HOST: ${{ secrets.PROD_SERVER_HOST }}
          PORT: ${{ secrets.PROD_SERVER_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Execute deployment on server
        env:
          HOST: ${{ secrets.PROD_SERVER_HOST }}
          USER: ${{ secrets.PROD_SERVER_USER }}
          PORT: ${{ secrets.PROD_SERVER_SSH_PORT || '22' }}
          PATH_DIR: ${{ secrets.PROD_DEPLOY_PATH || '/opt/new-api/deploy' }}
          IMAGE_TAG: ${{ steps.resolve_tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" bash -s "$IMAGE_TAG" "$REPO" "$PATH_DIR" <<'REMOTE_SCRIPT'
            set -euo pipefail
            IMAGE_TAG="$1"
            REPO="$2"
            PATH_DIR="$3"
            cd "$PATH_DIR"

            IMAGE_NAME="ghcr.io/${REPO}:${IMAGE_TAG}"
            echo "=== 1. 拉取新镜像: ${IMAGE_NAME} ==="
            podman pull "${IMAGE_NAME}"

            echo "=== 2. 记录当前运行的镜像（用于回滚） ==="
            PREV_IMAGE=$(podman inspect new-api --format '{{.Image}}' 2>/dev/null || echo "")
            echo "PREV_IMAGE=${PREV_IMAGE}"

            echo "=== 3. 更新 compose 并重启 new-api ==="
            sed -i -E "/^  new-api:/{n;s|^    image: .*|    image: ${IMAGE_NAME}|}" podman-compose.yml
            podman compose -f podman-compose.yml up -d --no-deps new-api

            echo "=== 4. 健康检查（最多等 45s） ==="
            HEALTH_PORT=$(grep -E '^\s*-\s*PORT=' podman-compose.yml | head -1 | sed -E 's/.*PORT=([0-9]+).*/\1/')
            HEALTH_PORT=${HEALTH_PORT:-3000}
            echo "健康检查端口: ${HEALTH_PORT}"
            HEALTHY=0
            for i in $(seq 1 15); do
              sleep 3
              CODE=$(curl -sS -m 3 -o /dev/null -w "%{http_code}" http://127.0.0.1:${HEALTH_PORT}/api/status 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "健康检查通过（HTTP 200，第 ${i} 次尝试）"
                HEALTHY=1
                break
              fi
              echo "等待服务就绪... (${i}/15, code=$CODE)"
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "::error::健康检查失败！正在回滚到: ${PREV_IMAGE}"
              if [ -n "${PREV_IMAGE}" ]; then
                sed -i -E "/^  new-api:/{n;s|^    image: .*|    image: ${PREV_IMAGE}|}" podman-compose.yml
                podman compose -f podman-compose.yml up -d --no-deps new-api
              fi
              exit 1
            fi

            echo "=== 5. 部署成功 ==="
            podman ps --filter name=new-api --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
          REMOTE_SCRIPT

      - name: Summary
        if: always()
        run: |
          echo "### 部署摘要" >> $GITHUB_STEP_SUMMARY
          echo "- **状态**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **镜像 Tag**: ${{ steps.resolve_tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **触发方式**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
