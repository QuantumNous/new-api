name: Deploy to Kubernetes

# 盲部署 publish workflow：
#   - 所有凭证来自 GitHub Actions Secrets，日志自动脱敏，仓库中无任何明文
#   - CI 从 Secrets 读值，在集群内幂等创建/更新 new-api-secrets，再 apply manifests
#   - manifests 只用 secretKeyRef 引用 Secret 名称
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置的 Secret：
#   KUBE_CONFIG_B64     base64 编码的 kubeconfig（runner 访问集群用）
#   SQL_DSN             自建 PostgreSQL 连接串
#   REDIS_CONN_STRING   自建 Redis 连接串
#   SESSION_SECRET      会话签名密钥（所有 Pod 一致）
#   CRYPTO_SECRET       缓存键 HMAC 密钥（共享 Redis 时所有 Pod 一致）
#   POSTGRES_DB         自建 PG 数据库名
#   POSTGRES_USER       自建 PG 用户名
#   POSTGRES_PASSWORD   自建 PG 密码
#   REDIS_PASSWORD      自建 Redis 密码
#
# 注意：若集群 API server 在内网不可从 GitHub 托管 runner 直连，
#       改用 self-hosted runner（runs-on 换成自托管标签）。

on:
  workflow_dispatch:
    inputs:
      worker_replicas:
        description: "worker 副本数"
        required: false
        default: "3"

concurrency:
  group: k8s-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create or refresh application secret
        run: |
          kubectl create secret generic new-api-secrets \
            --from-literal=sql-dsn="${{ secrets.SQL_DSN }}" \
            --from-literal=redis-conn="${{ secrets.REDIS_CONN_STRING }}" \
            --from-literal=session-secret="${{ secrets.SESSION_SECRET }}" \
            --from-literal=crypto-secret="${{ secrets.CRYPTO_SECRET }}" \
            --from-literal=postgres-db="${{ secrets.POSTGRES_DB }}" \
            --from-literal=postgres-user="${{ secrets.POSTGRES_USER }}" \
            --from-literal=postgres-password="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=redis-password="${{ secrets.REDIS_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply data layer
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl rollout status statefulset/postgres --timeout=180s
          kubectl rollout status statefulset/redis --timeout=120s

      - name: Apply new-api master and worker
        run: |
          kubectl apply -f k8s/new-api-master.yaml
          kubectl apply -f k8s/new-api-worker.yaml
          kubectl scale deployment/new-api-worker --replicas="${{ github.event.inputs.worker_replicas }}"
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/new-api-master --timeout=180s
          kubectl rollout status deployment/new-api-worker --timeout=180s

      - name: Report state
        run: |
          kubectl get pods -l app=new-api -o wide
          kubectl get svc new-api
