name: Deploy to Kubernetes

# 盲部署 publish workflow：
#   - 所有凭证来自 GitHub Actions Secrets，日志自动脱敏，仓库中无任何明文
#   - CI 从 Secrets 读值，在集群内幂等创建/更新 new-api-secrets，再 apply manifests
#   - manifests 只用 secretKeyRef 引用 Secret 名称
#   - 本 workflow 在 GitHub 托管 runner 上执行，通过公网直连 k3s API server
#     （kubeconfig 已由 setup-k3s.yml 改写为公网地址）
#
# 触发方式：
#   1. 手动：Actions 页面 → Deploy to Kubernetes → Run workflow
#   2. 自动：docker-build.yml 发布镜像成功后用 gh workflow run 调用本 workflow
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置的 Secret：
#   KUBE_CONFIG_B64     base64 编码的 kubeconfig（runner 访问集群用）
#   SQL_DSN             PostgreSQL 连接串（集群内 Pod 用 DNS 名 postgres:5432）
#   REDIS_CONN_STRING   Redis 连接串（集群内 Pod 用 DNS 名 redis:6379）
#   SESSION_SECRET      会话签名密钥（所有 Pod 一致）
#   CRYPTO_SECRET       缓存键 HMAC 密钥（共享 Redis 时所有 Pod 一致）
#   POSTGRES_DB         PG 数据库名（postgres.yaml 初始化用）
#   POSTGRES_USER       PG 用户名
#   POSTGRES_PASSWORD   PG 密码
#   REDIS_PASSWORD      Redis 密码（redis.yaml 初始化用）

on:
  workflow_dispatch:
    inputs:
      worker_replicas:
        description: "worker 副本数"
        required: false
        default: "3"
      image_tag:
        description: "要部署的不可变镜像 tag，如 sha-abc123 或 v0.11.0"
        required: true
        type: string


concurrency:
  group: k8s-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          case "$IMAGE_TAG" in
            ''|latest|*[!A-Za-z0-9_.-]*)
              echo "::error::image_tag must be an immutable Docker tag, not '$IMAGE_TAG'"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          # k3s 证书只签内网 IP，通过公网直连需跳过 TLS 校验并移除 CA 数据
          kubectl config set-cluster default --insecure-skip-tls-verify=true
          kubectl config unset clusters.default.certificate-authority-data
          kubectl cluster-info
          kubectl get nodes -o wide


      - name: Create or refresh application secret
        run: |
          kubectl create secret generic new-api-secrets \
            --from-literal=sql-dsn="${{ secrets.SQL_DSN }}" \
            --from-literal=redis-conn="${{ secrets.REDIS_CONN_STRING }}" \
            --from-literal=session-secret="${{ secrets.SESSION_SECRET }}" \
            --from-literal=crypto-secret="${{ secrets.CRYPTO_SECRET }}" \
            --from-literal=postgres-db="${{ secrets.POSTGRES_DB }}" \
            --from-literal=postgres-user="${{ secrets.POSTGRES_USER }}" \
            --from-literal=postgres-password="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=redis-password="${{ secrets.REDIS_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply data layer
        run: |
          kubectl apply -f deploy/k8s/postgres.yaml
          kubectl apply -f deploy/k8s/redis.yaml
          kubectl rollout status statefulset/postgres --timeout=180s
          kubectl rollout status statefulset/redis --timeout=120s

      - name: Apply new-api master
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          sed "s#ghcr.io/${{ github.repository }}:latest#${IMAGE}#g" deploy/k8s/new-api-master.yaml | kubectl apply -f -
          kubectl rollout status deployment/new-api-master --timeout=300s

      - name: Apply new-api worker
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          sed "s#ghcr.io/${{ github.repository }}:latest#${IMAGE}#g" deploy/k8s/new-api-worker.yaml | kubectl apply -f -
          kubectl scale deployment/new-api-worker --replicas="${{ github.event.inputs.worker_replicas }}"
          kubectl apply -f deploy/k8s/service.yaml
          kubectl apply -f deploy/k8s/ingress.yaml
          echo "部署镜像: $IMAGE"
      - name: Wait for rollout
        run: |
          # master 先就绪（它负责数据库迁移），worker 的 initContainer 会等 schema
          kubectl rollout status deployment/new-api-master --timeout=300s
          kubectl rollout status deployment/new-api-worker --timeout=420s

      - name: Diagnose on failure
        if: failure()
        run: |
          kubectl get pods -l app=new-api -o wide || true
          kubectl describe pods -l app=new-api,role=worker | tail -40 || true
          for p in $(kubectl get pods -l app=new-api,role=worker -o name); do
            echo "=== logs $p ==="
            kubectl logs "$p" --tail=30 --all-containers || true
          done

      - name: Report state
        run: |
          kubectl get pods -l app=new-api -o wide
          kubectl get svc new-api
