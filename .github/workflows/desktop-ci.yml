# Desktop Python, GUI unit, and hermetic Playwright suites.
name: Desktop CI

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[messaging,dev]"
      - name: Test
        run: pytest tests -q

  gui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: desktop/surfaces/gui
        run: npm ci
      - name: Unit tests
        working-directory: desktop/surfaces/gui
        run: npm test

  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: desktop/surfaces/gui
        run: npm ci
      - name: Install Playwright browsers
        working-directory: desktop/surfaces/gui
        run: npx playwright install --with-deps chromium
      - name: e2e
        working-directory: desktop/surfaces/gui
        run: npm run e2e
