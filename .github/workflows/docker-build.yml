name: Publish Docker image to GHCR (Multi-arch)

on:
  push:
    branches:
      - local-custom  # 监听到该分支有代码提交时自动触发
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v0.10.8 or local-custom)'
        required: false
        type: string
        default: 'latest'

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-latest  # 使用交叉编译，避免消耗付费/特定 arm 节点

    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag & write VERSION
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=${GITHUB_REF#refs/heads/}
          fi
          # 转小写，防止包含大写字母导致 GHCR 推送失败
          TAG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG} for ${{ matrix.arch }}"

      - name: Set up QEMU (For cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.TAG }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository }}:latest-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository }}:${{ env.TAG }}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Set version
        run: |
          TAG="${{ needs.build_single_arch.outputs.tag }}"
          TAG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (version tag)
        run: |
          REPO_IMAGE="ghcr.io/${{ github.repository }}"
          # 转小写确保安全
          REPO_IMAGE=$(echo "$REPO_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            -t ${REPO_IMAGE}:${TAG} \
            ${REPO_IMAGE}:${TAG}-amd64 \
            ${REPO_IMAGE}:${TAG}-arm64

      - name: Create & push manifest (latest tag)
        run: |
          REPO_IMAGE="ghcr.io/${{ github.repository }}"
          REPO_IMAGE=$(echo "$REPO_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            -t ${REPO_IMAGE}:latest \
            ${REPO_IMAGE}:latest-amd64 \
            ${REPO_IMAGE}:latest-arm64

      - name: Manifest summary
        run: |
          REPO_IMAGE="ghcr.io/${{ github.repository }}"
          REPO_IMAGE=$(echo "$REPO_IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "### Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ${REPO_IMAGE}:${TAG} >>$GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY