name: Publish Docker image (Multi-arch)

# 仅手动触发：镜像只在需要部署时构建，避免每次合并 main 或推送 tag
# 都跑一遍双架构构建、签名和 GHCR 推送。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build (default: main)'
        required: true
        default: 'main'
        type: string

concurrency:
  group: docker-publish-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      update_latest: ${{ steps.version.outputs.update_latest }}
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Resolve tag & write VERSION
        id: version
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          if git rev-parse --verify --quiet "refs/heads/${BUILD_REF}" >/dev/null; then
            TAG="sha-$(git rev-parse --short=12 HEAD)"
          elif git rev-parse --verify --quiet "refs/tags/${BUILD_REF}" >/dev/null; then
            TAG=$(printf '%s' "$BUILD_REF" | sed -E 's/[^A-Za-z0-9_.-]+/-/g')
          else
            TAG="sha-$(git rev-parse --short=12 HEAD)"
          fi
          UPDATE_LATEST=false
          if [ "$BUILD_REF" = "main" ] || [ "$BUILD_REF" = "refs/heads/main" ]; then
            UPDATE_LATEST=true
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "UPDATE_LATEST=${UPDATE_LATEST}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "update_latest=${UPDATE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG} from ${BUILD_REF} for ${{ matrix.arch }}"

      - name: Compose image tags
        id: image_tags
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository }}:${TAG}-${{ matrix.arch }}"
            if [ "${UPDATE_LATEST}" = "true" ]; then
              echo "ghcr.io/${{ github.repository }}:latest-${{ matrix.arch }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/image-prod/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Image summary
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository }}:${TAG}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write

    steps:
      - name: Set version
        run: |
          echo "TAG=${{ needs.build_single_arch.outputs.tag }}" >> $GITHUB_ENV
          echo "UPDATE_LATEST=${{ needs.build_single_arch.outputs.update_latest }}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (version)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${TAG} \
            ghcr.io/${{ github.repository }}:${TAG}-amd64 \
            ghcr.io/${{ github.repository }}:${TAG}-arm64

      - name: Create & push manifest (latest)
        if: env.UPDATE_LATEST == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:latest-amd64 \
            ghcr.io/${{ github.repository }}:latest-arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign manifests with cosign
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${TAG}
          if [ "${UPDATE_LATEST}" = "true" ]; then
            cosign sign --yes ghcr.io/${{ github.repository }}:latest
          fi

      - name: Manifest summary
        run: |
          echo "### Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${TAG} >> $GITHUB_STEP_SUMMARY
          if [ "${UPDATE_LATEST}" = "true" ]; then
            docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload tag artifact
        run: echo "$TAG" > tag.txt && cat tag.txt

      - name: Upload tag
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: docker-tag
          path: tag.txt
          retention-days: 1
