name: GCP Infra (Terraform)

on:
  pull_request:
    paths: ["deploy/gcp/**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deploy/gcp/envs/prod

jobs:
  # Keep the job id `plan` so existing branch-protection checks remain stable.
  # Production plan/apply require local Owner ADC and are intentionally not
  # available from GitHub Actions.
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: Terraform init (no production backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Record local-only execution policy
        run: |
          echo "GitHub Actions performs static Terraform validation only."
          echo "Run refreshing production plan/apply locally with Owner ADC and review OPERATIONS.md first."
