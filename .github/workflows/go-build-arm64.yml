name: Build Go Linux ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Web Frontend
        run: |
          cd web
          npm install
          npm run build
          cd ..

      - name: Build Go Binary (Linux ARM64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -ldflags="-s -w" -o new-api-arm64

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-arm64
          path: new-api-arm64
