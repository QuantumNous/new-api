name: Manual Build Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

env:
  REGISTRY  : ghcr.io
  IMAGE_NAME: yeschoy/new-api

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # ===================================================
      # 1. 拉取当前选择分支的代码
      # ===================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ===================================================
      # 2. 初始化 Docker Buildx
      # ===================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ===================================================
      # 3. 登录 GitHub Container Registry
      # ===================================================
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ===================================================
      # 4. 构建并上传 Docker 镜像
      # ===================================================
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: |
            ghcr.io/yeschoy/new-api:${{ inputs.tag }}
            ghcr.io/yeschoy/new-api:sha-${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max