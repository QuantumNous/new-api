# Builds and publishes the metaproxy fork image to GHCR.
# Runs on every v*-metaproxy.* tag push, or manually with a tag input.
name: metaproxy-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'git tag to build, e.g. v1.0.0-rc.21-metaproxy.1'
        required: true
  push:
    tags:
      - 'v*-metaproxy.*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/3metajun/new-api:${{ github.event.inputs.tag || github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/3metaJun/new-api
            org.opencontainers.image.description=metaproxy minimal fork of QuantumNous/new-api
