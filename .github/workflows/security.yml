name: Security

# Security gates that run next to ci.yml (which keeps vet/build/test and the
# frontend typecheck). Nothing here repeats a check ci.yml already runs.
on:
  pull_request:
  push:
    branches:
      - main
  # The upstream sync opens its PR with GITHUB_TOKEN, and GitHub starts no
  # pull_request run for such a PR. The sync workflow starts this one on the
  # branch instead; the run lands on the same commit and so appears on the PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new tool release never changes the gate silently.
  GOVULNCHECK_VERSION: v1.9.0
  GITLEAKS_VERSION: 8.30.1

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Scan root module
        run: govulncheck ./...

      - name: Scan relaykit independently
        working-directory: relaykit
        run: govulncheck ./...

      - name: Scan tokenkit independently
        working-directory: tokenkit
        run: govulncheck ./...

  bun-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Exits non-zero when an advisory of level high or critical is open. The two
      # ignored advisories (braces via shadcn, node-forge) have no fixed release yet;
      # remove each --ignore as soon as one ships.
      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm --ignore=GHSA-86w9-cpqp-85rv

  docker-image:
    name: Production image build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Builds deploy/Dockerfile without pushing: the only machine that measures
      # the production image. The laptop stays out of the build on purpose.
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=hisarweb-ai
          cache-to: type=gha,mode=max,scope=hisarweb-ai

  gitleaks:
    name: Secret scan over full history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          # Checksum from the same release's checksums file, verified at pin time.
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      # Scans every commit of this fork since the fork point (upstream history before
      # it is public QuantumNous work with its own 52 historic findings and is not ours
      # to rewrite), not just the diff. The config
      # extends the default ruleset and allowlists only values proven to be test
      # doubles; every allowlist entry names its file or the test that owns it.
      - name: Scan history
        run: gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml --log-opts="058c8231b68c51ee02abee15befcd720fee9f4a2..HEAD" .
