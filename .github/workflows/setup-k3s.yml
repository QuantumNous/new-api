name: Setup k3s cluster and self-hosted runner

# 一次性引导 workflow：自动在 SERVERS_LIST_JSON 列出的服务器上安装 k3s 集群 + Nginx Ingress + self-hosted runner。
#
# GitHub Actions Secrets（Settings → Secrets and variables → Actions → New repository secret）：
#   SERVERS_LIST_JSON  服务器列表 JSON 数组，整个 JSON 作为 secret 的值粘贴
#
# 认证方式：全程使用密码（sshpass）。服务器关闭密钥认证时也能工作。
# 密码通过 ::add-mask:: 脱敏，不泄露到日志。
#
# 流程：
#   1. 解析 SERVERS_LIST_JSON，逐台测试密码登录（失败的跳过）
#   2. 第一台成功装 k3s server（--disable traefik），其余装 agent（失败的不阻塞）
#   3. 装 nginx ingress + self-hosted runner（标签 k8s）
#   4. 导出 KUBE_CONFIG_B64 到 artifact

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Prepare servers list
        env:
          SERVERS_LIST_JSON: ${{ secrets.SERVERS_LIST_JSON }}
        run: |
          echo "$SERVERS_LIST_JSON" > /tmp/servers.json
          python3 << 'PYEOF'
          import json, sys
          try:
              data = json.load(open('/tmp/servers.json'))
              print('服务器数量:', len(data))
              for s in data:
                  print(s['ip'], '(' + s['user'] + ')')
              with open('/tmp/servers.txt', 'w') as f:
                  for s in data:
                      f.write(json.dumps(s, ensure_ascii=False) + '\n')
          except json.JSONDecodeError as e:
              print('::error::JSON 解析错误:', e)
              sys.exit(1)
          except KeyError as e:
              print('::error::缺少字段:', e)
              sys.exit(1)
          PYEOF

      - name: Test password login on all servers
        run: |
          : > /tmp/ssh_ok.txt
          while IFS= read -r s; do
            IP=$(echo "$s" | jq -r .ip)
            USER=$(echo "$s" | jq -r .user)
            PASS=$(echo "$s" | jq -r .password)
            echo "::add-mask::$PASS"
            echo "=== 测试 $USER@$IP ==="
            ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null || true
            if timeout 30 sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 "$USER@$IP" 'echo ok' >/tmp/ssh_test.log 2>&1; then
              echo "$IP $USER $PASS" >> /tmp/ssh_ok.txt
              echo "OK"
            else
              echo "FAILED: $(tail -1 /tmp/ssh_test.log)"
            fi
          done < /tmp/servers.txt
          echo "可用服务器: $(wc -l < /tmp/ssh_ok.txt)"

      - name: Install k3s server on first available
        run: |
          if [ ! -s /tmp/ssh_ok.txt ]; then
            echo "::error::没有可用的服务器（全部 SSH 失败）"
            exit 1
          fi
          read -r IP USER PASS < /tmp/ssh_ok.txt
          echo "::add-mask::$PASS"
          echo "K3S_SERVER_IP=$IP" >> $GITHUB_ENV
          echo "K3S_SERVER_USER=$USER" >> $GITHUB_ENV
          echo "K3S_SERVER_PASS=$PASS" >> $GITHUB_ENV
          echo "=== 安装 k3s server on $IP ==="
          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no "$USER@$IP" \
            'curl -sfL https://get.k3s.io | sh -s - --disable traefik'
          TOKEN=$(sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no "$USER@$IP" \
            'sudo cat /var/lib/rancher/k3s/server/node-token')
          echo "::add-mask::$TOKEN"
          echo "K3S_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "k3s server installed on $IP"

      - name: Install k3s agents on remaining servers
        run: |
          FIRST=1
          while IFS= read -r s; do
            if [ "$FIRST" -eq 1 ]; then FIRST=0; continue; fi
            IP=$(echo "$s" | jq -r .ip)
            USER=$(echo "$s" | jq -r .user)
            PASS=$(echo "$s" | jq -r .password)
            echo "::add-mask::$PASS"
            echo "=== 安装 k3s agent on $IP ==="
            if timeout 300 sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no "$USER@$IP" \
              "curl -sfL https://get.k3s.io | K3S_URL=https://$K3S_SERVER_IP:6443 K3S_TOKEN=$K3S_TOKEN sh -" >/tmp/agent_install.log 2>&1; then
              echo "agent installed on $IP"
            else
              echo "agent FAILED on $IP: $(tail -1 /tmp/agent_install.log)"
            fi
          done < /tmp/servers.txt

      - name: Install Nginx Ingress Controller
        run: |
          sshpass -p "$K3S_SERVER_PASS" ssh -o StrictHostKeyChecking=no "$K3S_SERVER_USER@$K3S_SERVER_IP" \
            'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/baremetal/deploy.yaml'
          echo "nginx ingress controller installed"

      - name: Verify cluster nodes
        run: |
          sshpass -p "$K3S_SERVER_PASS" ssh -o StrictHostKeyChecking=no "$K3S_SERVER_USER@$K3S_SERVER_IP" \
            'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && kubectl get nodes -o wide'

      - name: Get KUBE_CONFIG_B64 (public endpoint)
        run: |
          # 拉取 kubeconfig 并把 127.0.0.1 换成公网 IP，让 GitHub 托管 runner 能直连
          sshpass -p "$K3S_SERVER_PASS" ssh -o StrictHostKeyChecking=no "$K3S_SERVER_USER@$K3S_SERVER_IP" \
            'sudo cat /etc/rancher/k3s/k3s.yaml' > /tmp/kubeconfig.yaml
          sed -i "s|https://127.0.0.1:6443|https://$K3S_SERVER_IP:6443|g" /tmp/kubeconfig.yaml
          grep -q "https://$K3S_SERVER_IP:6443" /tmp/kubeconfig.yaml || {
            echo "::error::kubeconfig server 地址替换失败"; exit 1; }
          base64 -w0 < /tmp/kubeconfig.yaml > kubeconfig_b64.txt
          echo "kubeconfig 已指向 https://$K3S_SERVER_IP:6443"

      - name: Verify kubeconfig works from GitHub runner
        run: |
          curl -sL -o /tmp/kubectl "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          export KUBECONFIG=/tmp/kubeconfig.yaml
          /tmp/kubectl get nodes -o wide --insecure-skip-tls-verify --request-timeout=30s
          echo "GitHub 托管 runner 可直连集群，无需 self-hosted runner"

      - name: Get runner token (optional)
        id: runner_token
        continue-on-error: true
        run: |
          AUTH_TOKEN="${{ secrets.RUNNER_PAT }}"
          if [ -z "$AUTH_TOKEN" ]; then
            echo "未配置 RUNNER_PAT，跳过 self-hosted runner 注册（deploy 走 GitHub 托管 runner + kubeconfig）"
            exit 1
          fi
          RESP=$(curl -s -X POST \
            -H "Authorization: token $AUTH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token)
          REG_TOKEN=$(echo "$RESP" | jq -r '.token // empty')
          if [ -z "$REG_TOKEN" ]; then
            echo "RUNNER_PAT 无权限: $(echo "$RESP" | jq -r '.message // .')"
            exit 1
          fi
          echo "::add-mask::$REG_TOKEN"
          echo "REG_TOKEN=$REG_TOKEN" >> $GITHUB_ENV
          echo "RUNNER_VERSION=2.323.0" >> $GITHUB_ENV

      - name: Download runner archive
        if: steps.runner_token.outcome == 'success'
        continue-on-error: true
        run: |
          curl -sL -o /tmp/actions-runner.tar.gz \
            "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
          echo "runner archive downloaded: $(ls -lh /tmp/actions-runner.tar.gz | awk '{print $5}')"

      - name: Upload runner to server and register
        if: steps.runner_token.outcome == 'success'
        continue-on-error: true
        run: |
          sshpass -p "$K3S_SERVER_PASS" ssh -o StrictHostKeyChecking=no "$K3S_SERVER_USER@$K3S_SERVER_IP" \
            'sudo mkdir -p /opt/actions-runner && sudo chown $(whoami) /opt/actions-runner'
          sshpass -p "$K3S_SERVER_PASS" scp -o StrictHostKeyChecking=no \
            /tmp/actions-runner.tar.gz "$K3S_SERVER_USER@$K3S_SERVER_IP:/opt/actions-runner/"
          # RUNNER_ALLOW_RUNASROOT=1：config.sh 默认拒绝 root 运行
          sshpass -p "$K3S_SERVER_PASS" ssh -o StrictHostKeyChecking=no "$K3S_SERVER_USER@$K3S_SERVER_IP" "
            set -e
            cd /opt/actions-runner
            tar xzf actions-runner.tar.gz
            sudo ./bin/installdependencies.sh || true
            export RUNNER_ALLOW_RUNASROOT=1
            ./config.sh --url https://github.com/${{ github.repository }} --token $REG_TOKEN --labels k8s --name k3s-runner --unattended --replace
            sudo ./svc.sh install root
            sudo ./svc.sh start
          "
          echo "self-hosted runner registered (label: k8s)"

      - name: Upload kubeconfig artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeconfig-b64
          path: kubeconfig_b64.txt

      - name: Summarize
        run: |
          echo "### Setup complete" >> $GITHUB_STEP_SUMMARY
          echo "- k3s server: $K3S_SERVER_IP (API https://$K3S_SERVER_IP:6443 公网可达)" >> $GITHUB_STEP_SUMMARY
          echo "- Ingress Controller: installed (NodePort 30080/30443)" >> $GITHUB_STEP_SUMMARY
          echo "- kubeconfig: 已改写为公网地址，GitHub 托管 runner 可直连" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next steps" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 artifact kubeconfig_b64.txt，内容填为 KUBE_CONFIG_B64 secret" >> $GITHUB_STEP_SUMMARY
          echo "2. 触发 Deploy to Kubernetes workflow 部署应用" >> $GITHUB_STEP_SUMMARY