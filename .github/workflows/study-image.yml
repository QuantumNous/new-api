name: Study image

on:
  workflow_dispatch:
  push:
    branches:
      - "study/**"

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Stamp version
        run: |
          BASE_VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "${BASE_VERSION}"
          SHORT_SHA="${GITHUB_SHA::12}"
          BUILD_VERSION="${BASE_VERSION}.${SHORT_SHA}"
          printf '%s\n' "${BUILD_VERSION}" > VERSION
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - name: Test backend
        env:
          APP_PLUGIN_TEST_DIALECT: sqlite
          APP_PLUGIN_TEST_DSN: ""
          APP_PLUGIN_TEST_DRIVER: github.com/glebarez/sqlite@v1.11.0
          APP_PLUGIN_TEST_DATABASE_VERSION: 3.50.4
          APP_PLUGIN_TEST_IMAGE: ""
          APP_PLUGIN_TEST_PLATFORM: ""
          TZ: Asia/Shanghai
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go test ./...
          (cd relaykit && go test ./...)
      - name: Test frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pxxqc2t7bp-arch/new-api-study:${{ github.sha }}
            ghcr.io/pxxqc2t7bp-arch/new-api-study:${{ env.BUILD_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}
          provenance: mode=max
          sbom: true
      - name: Record immutable identity
        run: |
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "source_commit=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "image_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
