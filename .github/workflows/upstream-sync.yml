name: Upstream sync

# Eén vaste stap per dag: nieuwe upstream-tag, proefmerge, PR of issue.
# Geen model, geen matrix, geen retry: de volgende dag is de volgende kans.
on:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC, buiten de piek
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPO: QuantumNous/new-api
      BASIS: origin/main
      TAG_PATROON: v1.0.0-rc.*
      SYNC_TAK_PREFIX: sync/upstream-

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Rerere-cache terugzetten
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/rr-cache
          # Unieke sleutel per run: een vaste sleutel schrijft GitHub nooit opnieuw weg.
          key: rr-cache-${{ github.run_id }}
          restore-keys: rr-cache-

      - name: Synchroniseren
        run: bash .hw/sync-upstream.sh
