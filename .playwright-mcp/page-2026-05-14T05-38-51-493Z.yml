      - generic [ref=e37]:
        - heading "MD5签名算法" [level=2] [ref=e38]
        - paragraph [ref=e39]: 1、将发送或接收到的所有参数按照参数名ASCII码从小到大排序（a-z），sign、sign_type、和空值不参与签名！
        - paragraph [ref=e40]: 2、将排序后的参数拼接成URL键值对的格式，例如 a=b&c=d&e=f，参数值不要进行url编码。
        - paragraph [ref=e41]: 3、再将拼接好的字符串与商户密钥KEY进行MD5加密得出sign签名参数，sign = md5 ( a=b&c=d&e=f + KEY ) （注意：+ 为各语言的拼接符，不是字符！），md5结果为小写。
        - paragraph [ref=e42]: 4、具体签名与发起支付的示例代码可下载SDK查看。
        - heading "示例代码" [level=3] [ref=e43]
        - heading "PHP示例" [level=4] [ref=e44]
        - code [ref=e46]:
          - generic [ref=e47]: /** * 生成签名 * @param array $params 需要签名的参数数组 * @param string $key 商户密钥 * @return string 签名结果 */
          - generic [ref=e48]:
            - text: function getSign(
            - generic [ref=e49]: $params, $key
            - text: )
          - text: "{ // 1. 过滤空值和签名参数 $params = array_filter($params, function($value, $key) { return $value !== '' && $value !== null && $key != 'sign' && $key != 'sign_type'; }, ARRAY_FILTER_USE_BOTH); // 2. 按照参数名ASCII码从小到大排序 ksort($params); // 3. 拼接成URL键值对 $stringA = ''; foreach ($params as $k => $v) { $stringA .="
          - generic [ref=e50]: "\"{$k}={$v}&\""
          - text: "; } $stringA = rtrim($stringA, '&'); // 4. 拼接商户密钥并进行MD5加密 $stringSignTemp = $stringA . $key; return md5($stringSignTemp); } // 使用示例 $params = [ 'pid' => '1000', // 商户ID 'type' => 'alipay', // 支付方式 'out_trade_no' => '20240101123456', // 商户订单号 'notify_url' => 'http://www.example.com/notify_url.php', // 异步通知地址 'return_url' => 'http://www.example.com/return_url.php', // 跳转通知地址 'name' => '测试商品', // 商品名称 'money' => '100.00', // 金额 ]; // 商户密钥 $key = 'your_key_here'; // 生成签名 $sign = getSign($params, $key); $params['sign'] = $sign; $params['sign_type'] = 'MD5'; // 现在可以使用 $params 进行支付请求了"
        - paragraph [ref=e51]: 上述代码演示了如何按照规则生成签名，主要步骤：
        - list [ref=e52]:
          - listitem [ref=e53]: 过滤空值和签名参数（sign、sign_type）
          - listitem [ref=e54]: 按照参数名ASCII码排序
          - listitem [ref=e55]: 拼接成URL键值对格式
          - listitem [ref=e56]: 拼接商户密钥并进行MD5加密
        - paragraph [ref=e57]: 注意事项：
        - list [ref=e58]:
          - listitem [ref=e59]: 参数值不要进行URL编码
          - listitem [ref=e60]: MD5加密结果为小写
          - listitem [ref=e61]: 实际使用时请将示例中的商户密钥替换为您的实际密钥
