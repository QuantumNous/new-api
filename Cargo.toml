[workspace]
resolver = "2"
edition = "2021"
members = ["apps/cli", "crates/cli"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
dirs = "5"
