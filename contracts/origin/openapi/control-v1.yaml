        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/SessionCreated"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "423": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "429": {
            "$ref": "#/components/responses/RateLimitErrorResponse"
          }
        }
      },
      "delete": {
        "operationId": "revokeAllSessions",
        "summary": "Logout all devices for the current user",
        "security": [
          {
            "ControlSessionCookie": []
          }
        ],
        "responses": {
          "204": {
            "description": "All sessions revoked",
            "headers": {
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
