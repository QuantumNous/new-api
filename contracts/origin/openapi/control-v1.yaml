  "components": {
    "securitySchemes": {
      "ControlSessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "origin_session",
        "description": "Opaque 256-bit revocable session token. Set-Cookie is HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=604800. Only a SHA-256/HMAC token hash is stored. Each authenticated request slides expiry to seven days."
      }
    },
    "headers": {
      "RequestId": {
        "description": "Stable request correlation identifier",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "SessionCookie": {
        "description": "origin_session opaque token; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=604800",
        "schema": {
          "type": "string"
        }
      },
      "RetryAfter": {
        "description": "Seconds until retry is permitted",
        "schema": {
          "type": "integer",
          "minimum": 1
        }
      }
    },
    "parameters": {
      "TenantSelectorHeader": {
        "name": "X-Tenant-Id",
        "in": "header",
        "required": true,
        "description": "Tenant selection hint only. The server resolves it through the authenticated session user's active membership and never treats it as proof of identity.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "FromQuery": {
        "name": "from",
        "in": "query",
        "required": false,
        "description": "Inclusive RFC3339 occurrence-time lower bound.",
        "schema": {
          "type": "string",
          "format": "date-time"
        }
      },
      "ToQuery": {
        "name": "to",
        "in": "query",
        "required": false,
        "description": "Exclusive RFC3339 occurrence-time upper bound; must be later than from.",
        "schema": {
          "type": "string",
          "format": "date-time"
        }
      },
      "CursorQuery": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "description": "Opaque Base64URL keyset cursor returned by page.next_cursor.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 512
        }
      },
      "LimitQuery": {
        "name": "limit",
        "in": "query",
        "required": false,
        "description": "Page size.",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      },
      "ProjectIdQuery": {
        "name": "project_id",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "ApiKeyIdQuery": {
        "name": "api_key_id",
        "in": "query",
        "required": false,
        "description": "API Key identifier only; Key secret and mask are never returned.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "PlatformModelQuery": {
        "name": "platform_model",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 120
        }
      },
      "TerminalStatusQuery": {
        "name": "terminal_status",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "enum": [
            "SUCCESS",
            "CLIENT_DISCONNECTED",
            "CONTENT_FILTERED_OUTPUT",
            "UPSTREAM_ERROR",
            "UPSTREAM_TIMEOUT",
            "CONTENT_FILTERED_INPUT",
            "GATEWAY_REJECTED"
          ]
        }
      },
      "ErrorCodeQuery": {
        "name": "error_code",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 80,
          "pattern": "^[A-Za-z0-9_.:-]+$"
        }
      },
      "SourceQuery": {
        "name": "source",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "enum": [
            "api",
            "chat"
          ]
        }
      },
      "RequestIdQuery": {
        "name": "request_id",
        "in": "query",
        "required": false,
        "description": "Exact request identifier lookup.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "LedgerTransactionTypeQuery": {
        "name": "transaction_type",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "enum": [
            "CHARGE",
            "RECHARGE",
            "BONUS_GRANT",
            "BONUS_EXPIRE",
            "REFUND",
            "REVERSAL",
            "ADJUSTMENT"
          ]
        }
      },
      "TenantIdPath": {
        "name": "tenant_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "UserIdPath": {
        "name": "user_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "InvitationTokenPath": {
        "name": "token",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 32,
          "maxLength": 128,
          "pattern": "^[A-Za-z0-9_-]+$"
        }
      },
      "IdempotencyKeyHeader": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "8-128 characters. Same scope/key/canonical payload replays the first business result; a different payload returns 409 idempotency_key_reused. Records and business effects share one PostgreSQL transaction and are retained at least 24 hours.",
        "schema": {
          "type": "string",
          "minLength": 8,
          "maxLength": 128,
          "pattern": "^[A-Za-z0-9._:-]+$"
        }
      },
      "ProjectIdPath": {
        "name": "project_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "ApiKeyIdPath": {
        "name": "key_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
