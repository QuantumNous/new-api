    "schemas": {
      "RequestId": {
        "type": "string",
        "format": "uuid"
      },
      "SmsChallengeRequest": {
        "type": "object",
        "required": [
          "phone",
          "purpose"
        ],
        "additionalProperties": false,
        "properties": {
          "phone": {
            "$ref": "#/components/schemas/Phone"
          },
          "purpose": {
            "type": "string",
            "enum": [
              "REGISTRATION",
              "LOGIN"
            ]
          },
          "captcha_token": {
            "type": "string",
            "minLength": 8,
            "maxLength": 512
          }
        }
      },
      "SmsChallengeResponse": {
        "type": "object",
        "required": [
          "data",
          "request_id"
        ],
        "additionalProperties": false,
        "properties": {
          "data": {
            "type": "object",
            "required": [
              "challenge_id",
              "expires_at",
              "cooldown_seconds"
            ],
            "additionalProperties": false,
            "properties": {
              "challenge_id": {
                "type": "string",
                "format": "uuid"
              },
              "expires_at": {
                "type": "string",
                "format": "date-time"
              },
              "cooldown_seconds": {
                "type": "integer",
                "const": 60
              }
            }
          },
          "request_id": {
            "$ref": "#/components/schemas/RequestId"
          }
        }
      },
      "RegisterRequest": {
        "type": "object",
        "required": [
          "challenge_id",
          "code",
          "agreements",
          "registration_nonce"
        ],
        "additionalProperties": false,
        "properties": {
          "challenge_id": {
            "type": "string",
            "format": "uuid"
          },
          "code": {
            "$ref": "#/components/schemas/OtpCode"
          },
          "agreements": {
            "type": "array",
            "minItems": 2,
            "maxItems": 2,
            "items": {
              "$ref": "#/components/schemas/AgreementAcceptance"
            }
          },
          "registration_nonce": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "AgreementAcceptance": {
        "type": "object",
        "required": [
          "type",
          "version"
        ],
        "additionalProperties": false,
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "terms",
              "privacy"
            ]
          },
          "version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 40
          }
        }
      },
      "CreateSessionRequest": {
        "oneOf": [
          {
            "type": "object",
            "required": [
              "mode",
              "challenge_id",
              "code"
            ],
            "additionalProperties": false,
            "properties": {
              "mode": {
                "type": "string",
                "const": "SMS"
              },
              "challenge_id": {
                "type": "string",
                "format": "uuid"
              },
              "code": {
                "$ref": "#/components/schemas/OtpCode"
              }
            }
          },
          {
            "type": "object",
            "required": [
              "mode",
              "phone",
              "password"
            ],
            "additionalProperties": false,
            "properties": {
              "mode": {
                "type": "string",
                "const": "PASSWORD"
              },
              "phone": {
                "$ref": "#/components/schemas/Phone"
              },
              "password": {
                "type": "string",
                "minLength": 8,
                "maxLength": 128,
                "writeOnly": true
              }
            }
          }
        ]
      },
      "UpdateSecurityRequest": {
        "type": "object",
        "required": [
          "new_password"
        ],
        "additionalProperties": false,
        "properties": {
          "new_password": {
            "type": "string",
            "minLength": 8,
            "maxLength": 128,
            "writeOnly": true,
            "description": "Must contain characters from at least two of uppercase, lowercase, digit and symbol categories."
          }
        }
      },
      "CreateEnterpriseTenantRequest": {
        "type": "object",
        "required": [
          "name"
        ],
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          }
        }
      },
      "InvitationRequest": {
        "oneOf": [
          {
            "type": "object",
            "required": [
              "mode",
              "target_phone"
            ],
            "additionalProperties": false,
            "properties": {
              "mode": {
                "type": "string",
                "const": "PHONE"
              },
              "target_phone": {
                "$ref": "#/components/schemas/Phone"
              }
            }
          },
          {
            "type": "object",
            "required": [
              "mode"
            ],
            "additionalProperties": false,
            "properties": {
              "mode": {
                "type": "string",
                "const": "LINK"
              }
            }
          }
        ]
      },
      "CertificationRequest": {
        "type": "object",
        "required": [
          "company_name",
          "unified_social_credit_code",
          "license_file_reference",
          "legal_representative_name",
          "contact_name",
          "contact_phone"
        ],
        "additionalProperties": false,
        "properties": {
          "company_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "unified_social_credit_code": {
            "type": "string",
            "pattern": "^[0-9ABCDEFGHJKLMNPQRTUWXY]{18}$",
            "writeOnly": true
          },
          "license_file_reference": {
            "type": "string",
            "minLength": 8,
            "maxLength": 256,
            "description": "Opaque reference previously issued by the configured private object/file storage Adapter."
          },
          "legal_representative_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "writeOnly": true
          },
          "contact_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "writeOnly": true
          },
          "contact_phone": {
            "$ref": "#/components/schemas/Phone"
          }
        }
      },
      "CreateProjectRequest": {
        "type": "object",
        "required": [
          "name"
        ],
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 30
