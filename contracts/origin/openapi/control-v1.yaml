      "Page": {
        "type": "object",
        "required": [
          "next_cursor",
          "has_more"
        ],
        "additionalProperties": false,
        "properties": {
          "next_cursor": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1,
            "maxLength": 512
          },
          "has_more": {
            "type": "boolean"
          }
        }
      },
      "Quantity": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]*)(\\.[0-9]{1,9})?$"
      },
      "MoneyAmount": {
        "type": "string",
        "pattern": "^-?(0|[1-9][0-9]*)\\.[0-9]{6}$",
        "description": "Exact CNY decimal amount derived from integer micros; never a JSON number."
      },
      "MeteringItem": {
        "type": "object",
        "required": [
          "meter_type",
          "quantity",
          "unit"
        ],
        "additionalProperties": false,
        "properties": {
          "meter_type": {
            "type": "string",
            "enum": [
              "INPUT_TOKEN",
              "OUTPUT_TOKEN",
              "CACHED_TOKEN",
              "REASONING_TOKEN",
              "IMAGE",
              "AUDIO_SECOND",
              "VIDEO_SECOND",
              "REQUEST",
              "CUSTOM"
            ]
          },
          "quantity": {
            "$ref": "#/components/schemas/Quantity"
          },
          "unit": {
            "type": "string",
            "enum": [
              "token",
              "image",
              "second",
              "request",
              "custom"
            ]
          }
        }
      },
      "CallLog": {
        "type": "object",
        "required": [
          "id",
          "request_id",
          "project_id",
          "api_key_id",
          "source",
          "operation",
          "platform_model",
          "provider",
          "provider_model",
          "terminal_status",
          "settlement_status",
          "error_code",
          "billable",
          "usage_source",
          "metering_items",
          "input_tokens",
          "output_tokens",
          "amount",
          "cash_amount",
          "bonus_amount",
          "occurred_at"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "project_id": {
            "type": "string",
            "format": "uuid"
          },
          "api_key_id": {
            "type": "string",
            "format": "uuid"
          },
          "source": {
            "type": "string",
            "enum": [
              "api",
              "chat"
            ]
          },
          "operation": {
            "type": "string",
            "enum": [
              "chat",
              "chat_stream",
              "responses",
              "responses_stream",
              "embeddings",
              "video_generation"
            ]
          },
          "platform_model": {
            "type": "string"
          },
          "provider": {
            "type": [
              "string",
              "null"
            ],
            "description": "Provider code when execution routing has been projected; null while the call is pending or the outcome is unresolved."
          },
          "provider_model": {
            "type": [
              "string",
              "null"
            ],
            "description": "Upstream model identifier when execution routing has been projected; null while the call is pending or the outcome is unresolved."
          },
          "terminal_status": {
            "type": [
              "string",
              "null"
            ],
            "description": "Terminal request outcome, or null while no terminal outcome is known. This field is not a settlement state.",
            "enum": [
              "SUCCESS",
              "CLIENT_DISCONNECTED",
              "CONTENT_FILTERED_OUTPUT",
              "UPSTREAM_ERROR",
              "UPSTREAM_TIMEOUT",
              "CONTENT_FILTERED_INPUT",
              "GATEWAY_REJECTED",
              null
            ]
          },
          "settlement_status": {
            "type": "string",
            "readOnly": true,
            "description": "Authoritative Platform settlement projection for every call log. PENDING means a reservation is still ACTIVE and all amount fields are provisional. SETTLED means the amount fields are final, including a legitimate zero charge. RELEASED means the reservation was safely released without charge. RECONCILIATION_REQUIRED means the outcome or usage is unresolved; amount fields are not final and must never be presented as a zero-cost success. Historical charge-backed rows without a reservation are SETTLED.",
            "enum": [
              "PENDING",
              "SETTLED",
              "RELEASED",
              "RECONCILIATION_REQUIRED"
            ]
          },
