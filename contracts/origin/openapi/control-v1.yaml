{
  "openapi": "3.1.0",
  "info": {
    "title": "Origin-ai Control API",
    "version": "1.4.0-draft",
    "description": "Customer control-plane contract. Browser authentication uses an opaque, revocable session cookie; client-supplied user identity headers are never trusted."
  },
  "servers": [
    {
      "url": "https://platform.example.com"
    }
  ],
  "paths": {
    "/api/v1/auth/sms-challenges": {
      "post": {
        "operationId": "createSmsChallenge",
        "summary": "Create a six-digit SMS challenge valid for five minutes",
        "description": "The same phone is limited to one send per 60 seconds and ten sends per Asia/Shanghai day. The third request from one IP in a rolling minute requires a valid captcha token.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKeyHeader"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SmsChallengeRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/SmsChallengeCreated"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "429": {
            "$ref": "#/components/responses/RateLimitErrorResponse"
          },
          "503": {
            "$ref": "#/components/responses/ErrorResponse"
          }
        }
      }
    },
    "/api/v1/auth/registrations": {
      "post": {
        "operationId": "registerWithPhone",
        "summary": "Verify a registration challenge and atomically initialize the personal tenant",
        "description": "Idempotency scope is normalized phone hash + operation + Idempotency-Key. The sanitized business response is retained for at least 24 hours. API Key cleartext and the initial session token are returned only on the first successful response and are never stored in the idempotency record; replay returns the same business IDs and masked Key without secrets or Set-Cookie.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKeyHeader"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RegisterRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/RegistrationCreated"
          },
          "400": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "409": {
            "$ref": "#/components/responses/ErrorResponse"
          },
          "429": {
            "$ref": "#/components/responses/RateLimitErrorResponse"
          }
        }
      }
    },
    "/api/v1/auth/sessions": {
      "post": {
        "operationId": "createSession",
        "summary": "Login with an SMS challenge or password",
        "description": "Five consecutive password failures lock password login for 15 minutes. SMS login remains available while password login is locked.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKeyHeader"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
