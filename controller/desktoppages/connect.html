<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Connect desktop assistant</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --ink: #14151a;
      --muted: #5c5f66;
      --line: #e3e1db;
      --accent: #c93e22;
      --accent-hover: #a8321b;
      --on-accent: #ffffff;
      --error: #b42318;
      --radius: 16px;
      --shadow: 0 18px 50px rgba(20, 21, 26, 0.08);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0f12;
        --surface: #17191e;
        --ink: #eceef2;
        --muted: #9aa0a8;
        --line: #2a2d34;
        --accent: #e8a33d;
        --accent-hover: #f0b65a;
        --on-accent: #1a1208;
        --error: #f08070;
        --shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: radial-gradient(
          1200px 600px at 50% -10%,
          color-mix(in srgb, var(--accent) 12%, transparent),
          transparent 60%
        ),
        var(--bg);
      color: var(--ink);
    }
    main {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 24px 22px;
    }
    .mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--accent) 14%, var(--surface));
      color: var(--accent);
      font-size: 22px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }
    button[data-yeschoy-connect] {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 650;
      cursor: pointer;
      background: var(--accent);
      color: var(--on-accent);
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button[data-yeschoy-connect]:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    button[data-yeschoy-connect]:active:not(:disabled) {
      transform: scale(0.99);
    }
    button[data-yeschoy-connect]:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    #status {
      min-height: 1.25rem;
      margin: 14px 0 0;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.45;
    }
    #status.is-error {
      color: var(--error);
    }
    footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
    }
    footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
  <script src="/connect.js" defer></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">↗</div>
    <h1 id="title">Connect desktop assistant</h1>
    <p class="lede" id="lede">
      Sign in on this site if you have not already, then use the button below.
      Your browser will open the YesChoy desktop app — no API keys to copy.
    </p>
    <button type="button" data-yeschoy-connect id="connect-btn">
      Open YesChoy desktop
    </button>
    <p id="status" role="status" aria-live="polite"></p>
    <footer>
      <span id="footer-no-app">No desktop app?</span>
      <a id="footer-download" href="https://yeschoy.com/download">Download</a>
    </footer>
  </main>
  <script>
    (function () {
      var zh =
        document.documentElement.lang.startsWith("zh") ||
        (navigator.language && navigator.language.startsWith("zh"));
      if (zh) {
        document.documentElement.lang = "zh-CN";
        document.getElementById("title").textContent = "连接桌面助手";
        document.getElementById("lede").textContent =
          "若尚未登录，请先在本站完成登录，再点击下方按钮。浏览器会拉起 YesChoy 桌面端，无需复制 API 密钥。";
        document.getElementById("connect-btn").textContent = "打开桌面助手";
        document.getElementById("footer-no-app").textContent = "还没有桌面端？";
        document.getElementById("footer-download").textContent = "下载安装";
        document.title = "连接桌面助手";
      }

      var btn = document.getElementById("connect-btn");
      var status = document.getElementById("status");

      function setStatus(text, isError) {
        status.textContent = text || "";
        status.className = isError ? "is-error" : "";
      }

      var messages = zh
        ? {
            issuing: "正在申请连接…",
            opening: "正在打开桌面助手…",
            session_required: "请先登录本站，再连接桌面助手。",
            sign_in: "登录本站",
            connect: "打开桌面助手",
            connect_origin_not_https: "此页面须通过 HTTPS 访问。",
            issue_failed: "暂时无法连接，请稍后重试。",
            generic: "连接未完成，请重试。",
          }
        : {
            issuing: "Requesting connection…",
            opening: "Opening the desktop app…",
            session_required: "Sign in on this site before connecting the desktop app.",
            sign_in: "Sign in",
            connect: "Open YesChoy desktop",
            connect_origin_not_https: "This page must be served over HTTPS.",
            issue_failed: "Could not connect right now. Try again shortly.",
            generic: "Connection did not finish. Try again.",
          };

      var loginMode = false;
      var connectApi = null;

      function buildConnectReturnPath() {
        return window.location.pathname + window.location.search;
      }

      function buildSignInUrl() {
        var redirect = encodeURIComponent(buildConnectReturnPath());
        return "/sign-in?redirect=" + redirect;
      }

      function normalizeReasonCode(err) {
        if (!err) return "issue_failed";
        var code = err.reasonCode ? String(err.reasonCode) : "issue_failed";
        if (
          connectApi &&
          typeof connectApi.normalizeIssueReasonCode === "function"
        ) {
          return connectApi.normalizeIssueReasonCode(
            code,
            err.httpStatus || 0
          );
        }
        return code;
      }

      function enterLoginRequiredMode() {
        loginMode = true;
        btn.textContent = messages.sign_in;
        btn.disabled = false;
        setStatus(messages.session_required, true);
      }

      function enterConnectMode() {
        loginMode = false;
        btn.textContent = messages.connect;
        btn.disabled = false;
        setStatus("", false);
      }

      btn.addEventListener(
        "click",
        function (event) {
          if (loginMode) {
            event.preventDefault();
            event.stopImmediatePropagation();
            window.location.assign(buildSignInUrl());
            return;
          }
          setStatus(messages.issuing, false);
          btn.disabled = true;
        },
        true
      );

      btn.addEventListener("yeschoy-connect-error", function (event) {
        btn.disabled = false;
        var err = event.detail;
        var code = normalizeReasonCode(err);
        if (code === "session_required") {
          enterLoginRequiredMode();
          return;
        }
        var text = messages[code] || messages.generic;
        setStatus(text, true);
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          setStatus(messages.opening, false);
        }
      });

      function shouldAutoConnect() {
        return new URLSearchParams(window.location.search).get("auto") === "1";
      }

      function probeBrowserSession() {
        return fetch("/api/user/self", {
          method: "GET",
          credentials: "include",
        }).then(function (response) {
          if (response.status === 401) {
            enterLoginRequiredMode();
            return false;
          }
          if (!response.ok) {
            return false;
          }
          enterConnectMode();
          return true;
        });
      }

      function initConnectPage() {
        connectApi = window.YeschoyConnect;
        if (!connectApi) return;
        window.setTimeout(function () {
          probeBrowserSession().then(function (signedIn) {
            if (signedIn && shouldAutoConnect()) {
              btn.click();
            }
          });
        }, 0);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initConnectPage);
      } else {
        initConnectPage();
      }
    })();
  </script>
</body>
</html>
