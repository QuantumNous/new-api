name: new-api-async-staging

x-new-api-environment: &new-api-environment
  SQL_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_TRUSTED_URL: https://async-api.nexaapp.cn
  CRYPTO_SECRET: ${CRYPTO_SECRET}
  ASYNC_REQUEST_ENCRYPTION_KEY: ${ASYNC_REQUEST_ENCRYPTION_KEY}
  ASYNC_YUNWU_ALLOWED_BASE_URLS: https://yunwu.ai
  ASYNC_GRSAI_ALLOWED_BASE_URLS: https://grsaiapi.com,https://grsai.dakka.com.cn
  ASYNC_MAX_REQUEST_BODY_KB: 256
  ASYNC_MAX_PROMPT_CHARS: 8000
  ASYNC_MAX_INPUT_URLS: 8
  ASYNC_ARTIFACT_MAX_FILES: 8
  ASYNC_ARTIFACT_MAX_FILE_MB: 25
  ASYNC_ARTIFACT_MAX_TOTAL_MB: 100
  ASYNC_ARTIFACT_DOWNLOAD_TIMEOUT_SECONDS: 120
  ASYNC_ARTIFACT_ARCHIVE_TIMEOUT_SECONDS: 300
  ASYNC_SIGNED_URL_TTL_SECONDS: 900
  ASYNC_UPSTREAM_MAX_RESPONSE_MB: 64
  ASYNC_YUNWU_ROUTE_SUFFIX: stable
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://async-files.nexaapp.cn
  S3_REGION: us-east-1
  S3_BUCKET: new-api-staging-artifacts
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_USE_PATH_STYLE: "true"
  BATCH_UPDATE_ENABLED: "false"
  ERROR_LOG_ENABLED: "true"
  TZ: Asia/Shanghai

services:
  new-api:
    image: new-api-async-relay:staging-20260718-grsai-amd64
    restart: unless-stopped
    command: ["--log-dir", "/app/logs"]
    environment:
      <<: *new-api-environment
      APP_ROLE: api
      NODE_TYPE: master
      NODE_NAME: new-api-async-staging-api
    ports:
      - "127.0.0.1:33001:3000"
    volumes:
      - new_api_data:/data
      - new_api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [backend]
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  new-api-worker:
    image: new-api-async-relay:staging-20260718-grsai-amd64
    restart: unless-stopped
    command: ["--log-dir", "/app/logs"]
    environment:
      <<: *new-api-environment
      APP_ROLE: worker
      NODE_TYPE: slave
      NODE_NAME: new-api-async-staging-worker
      ASYNC_WORKER_ID: new-api-async-staging-worker-1
      ASYNC_WORKER_CONCURRENCY: 1
      ASYNC_CHANNEL_DEFAULT_CONCURRENCY: 1
      ASYNC_WORKER_LEASE_SECONDS: 90
      ASYNC_WORKER_POLL_MILLISECONDS: 1000
      ASYNC_JOB_TIMEOUT_SECONDS: 1800
      ASYNC_RESULT_RETENTION_MINUTES: 60
      ASYNC_ARTIFACT_CLEANUP_INTERVAL_SECONDS: 60
    volumes:
      - worker_logs:/app/logs
    depends_on:
      new-api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [backend]
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 256
    stop_grace_period: 35m

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend]
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:33900:9000"
      - "127.0.0.1:33901:9001"
    networks: [backend]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing local/new-api-staging-artifacts;
        mc anonymous set private local/new-api-staging-artifacts
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64

volumes:
  new_api_data:
  new_api_logs:
  worker_logs:
  postgres_data:
  redis_data:
  minio_data:

networks:
  backend:
    driver: bridge
