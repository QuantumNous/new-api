apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: karmada-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: karmada-dashboard
    namespace: karmada-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karmada-dashboard
  namespace: karmada-system
---
apiVersion: v1
kind: Secret
metadata:
  name: karmada-dashboard-token
  namespace: karmada-system
  annotations:
    kubernetes.io/service-account.name: karmada-dashboard
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: karmada-dashboard-cluster-proxy
rules:
  - apiGroups: [cluster.karmada.io]
    resources: [clusters, clusters/proxy]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: karmada-dashboard-cluster-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: karmada-dashboard-cluster-proxy
subjects:
  - kind: ServiceAccount
    name: karmada-dashboard
    namespace: karmada-system
