# 集群内自建 Redis：所有 new-api Pod 共享同一个端点。
#
# 说明：
#   - new-api 只识别一个 Redis 端点，不解析 Redis Cluster / Sentinel 节点列表
#   - 共享同一 Redis 时，会话撤销与版本发布即时传播，限流额度跨副本共享
#   - 所有连接同一 Redis 的 Pod 必须使用相同的 CRYPTO_SECRET，否则缓存键摘要不一致
#   - 密码通过 new-api-secrets 注入，清单中不含明文
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # 与 postgres 同理：数据层固定在最稳定的 control-plane 节点。
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          # 密码通过环境变量注入后由 shell 展开，避免写进清单。
          command: ["sh", "-c"]
          args:
            - 'exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: redis-password
            # redis-cli 自动读取 REDISCLI_AUTH，避免把密码写进探针 argv（会暴露在 ps 里并每次告警）。
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: redis-password
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
