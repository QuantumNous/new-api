apiVersion: v1
kind: Service
metadata:
  name: new-api
  namespace: new-api
  labels:
    app.kubernetes.io/name: new-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-08e2c697899fd9c9b,subnet-0ebf4de18d18c8fe1,subnet-0d4439f65e797dfda
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app.kubernetes.io/name: new-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
