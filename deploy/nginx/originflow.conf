# =============================================================================
# OriginFlow (元点流商) — nginx 站点配置
# -----------------------------------------------------------------------------
# 域名规划（ADR-1 域名隔离）：
#   www.91flow.com   -> 营销前台（由 SPA 的营销路由树渲染）
#   app.91flow.com   -> New-API 原生控制台
#   api.91flow.com   -> Relay / OpenAI 兼容 API（对外调用入口）
#
# 架构说明：
#   生产构建为单个内嵌 SPA（web/default/dist 由 main.go 的 //go:embed 提供，
#   SPA fallback 在 router/web-router.go 的 NoRoute）。同一份构建经两个 server
#   block 提供服务。前端按 location.host 以 'www.' 开头切换营销/控制台路由，
#   因此 nginx 只需把全部请求（SPA 静态 + /api + /v1）反代到 Go 后端即可。
#
# 后端地址：
#   裸机/VM：`server 127.0.0.1:3000;`
#   Docker Compose：把下面 upstream 的地址改为 `server new-api:3000;`
#
# 证书（Let's Encrypt / certbot）：
#   certbot certonly --webroot -w /var/www/certbot \
#     -d www.91flow.com -d app.91flow.com -d api.91flow.com
#   证书路径：/etc/letsencrypt/live/<domain>/fullchain.pem 与 privkey.pem
# =============================================================================

# WebSocket / SSE 升级：仅当客户端发起 Upgrade 时才置为 upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream originflow_backend {
    # 裸机：127.0.0.1:3000 ；Docker：new-api:3000
    server 127.0.0.1:3000;
    keepalive 32;
}

# 通用代理参数（被各 server block 复用）
proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# -----------------------------------------------------------------------------
# HTTP -> HTTPS（三个域名统一跳转）
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name www.91flow.com app.91flow.com api.91flow.com;

    # certbot 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# www.91flow.com — 营销前台
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.91flow.com;

    ssl_certificate     /etc/letsencrypt/live/www.91flow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.91flow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;  # 联系销售等表单提交

    location / {
        proxy_pass http://originflow_backend;
    }
}

# -----------------------------------------------------------------------------
# app.91flow.com — 原生控制台
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name app.91flow.com;

    ssl_certificate     /etc/letsencrypt/live/app.91flow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.91flow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;  # 控制台含文件上传/充值等

    location / {
        proxy_pass http://originflow_backend;
    }
}

# -----------------------------------------------------------------------------
# api.91flow.com — Relay / OpenAI 兼容 API（对外调用入口）
#   开启 CORS 以便第三方前端跨域调用；其余行为与另外两个域名一致（共用同一后端）。
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.91flow.com;

    ssl_certificate     /etc/letsencrypt/live/api.91flow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.91flow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 对外 API：开放 CORS（使用 Bearer Token，不涉及 Cookie，故可用 "*"）
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    client_max_body_size 50m;

    # 预检请求直接返回 204
    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://originflow_backend;
    }
}
