services:
  new-api-staging:
    image: new-api-custom:custom-b22f4ddf
    restart: always
    ports:
      - "0.0.0.0:3100:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - new-api-staging-network

  postgres:
    image: postgres:16-alpine
    restart: always
    ports:
      - "127.0.0.1:15432:5432"
    env_file:
      - .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - new-api-staging-network

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - new-api-staging-network

networks:
  new-api-staging-network:
    name: new-api-staging-network
