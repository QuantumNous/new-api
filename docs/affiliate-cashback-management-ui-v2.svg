<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="920" viewBox="0 0 1536 920">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .font { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 27px; font-weight: 700; fill: #171b24; }
      .subtitle { font-size: 16px; fill: #737b88; }
      .label { font-size: 14px; fill: #7c8490; }
      .value { font-size: 20px; font-weight: 700; fill: #171b24; }
      .section { font-size: 18px; font-weight: 700; fill: #171b24; }
      .table-head { font-size: 13px; font-weight: 600; fill: #737b88; }
      .cell { font-size: 14px; fill: #252b36; }
      .cell-strong { font-size: 14px; font-weight: 600; fill: #171b24; }
      .muted { font-size: 12px; fill: #9098a5; }
      .blue { fill: #1677ff; }
      .green { fill: #1b9b67; }
      .orange { fill: #b56b00; }
    </style>
