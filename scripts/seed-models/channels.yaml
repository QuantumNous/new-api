    base_url: https://api.anthropic.com
    test_model: claude-haiku-4-5-20251001
    tag: anthropic
    models:
      # Claude 5 系列（当前）—— 官方 ID 不带日期后缀
      - claude-opus-5
      - claude-sonnet-5
      - claude-fable-5
      # Opus 5 思维深度变体
      - claude-opus-5-max
      - claude-opus-5-xhigh
      - claude-opus-5-high
      - claude-opus-5-medium
      - claude-opus-5-low
      # Claude 4.6 – 4.8
      - claude-opus-4-8
      - claude-opus-4-7
      - claude-opus-4-6
      - claude-sonnet-4-6
      - claude-haiku-4-5-20251001
      # Opus 4.8 思维深度变体
      - claude-opus-4-8-max
      - claude-opus-4-8-xhigh
      - claude-opus-4-8-high
      - claude-opus-4-8-medium
      - claude-opus-4-8-low
      # Opus 4.7 思维深度变体
      - claude-opus-4-7-max
      - claude-opus-4-7-xhigh
      - claude-opus-4-7-high
      - claude-opus-4-7-medium
      - claude-opus-4-7-low
      # Claude 4.0 – 4.5（快照式 ID）
      - claude-opus-4-5-20251101
      - claude-sonnet-4-5-20250929
      # Claude 3.x 已被 Anthropic 全部下线（3.5 sonnet 2025-10-28、3 opus 2026-01-05、
      # 3.7 sonnet / 3.5 haiku 2026-02-19、3 haiku 2026-04-19），不再种子化。

