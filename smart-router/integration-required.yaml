apiVersion: smart-router.integration/v1
kind: HostHooks
status: host-integrated-local-verified
verification:
  scope: synthetic-local-real-host-and-independent-sidecar
  fixture: tests/hostfixture/main.go
  host_test: router/relay_smart_router_test.go:TestSmartRouterRealSidecarEndToEnd
  production_deployment: not-performed
  real_provider_verification: not-performed
  crash_durable_exactly_once: not-claimed
  modeltrace_operator_plane: pending
  task3_acceptance: independent-spec-and-quality-passed-at-7a29b11
  task_a2_acceptance: fresh-merged-candidate-verification-and-reviews-required
  task_a2_i1_acceptance: strict-eligibility-repair-fresh-spec-then-quality-required
ownership:
  router_database: standalone
  host_database_access: forbidden
  provider_credentials: host-only
  provider_response_bodies: host-only
hooks:
  - name: request_route
    direction: host-to-router
    transport: http
    method: POST
    path: /v1/route
    request_contract: route_request
    response_contract: route_response
    implementation: service/smart_router.go:SelectSmartRouterChannel
  - name: report_attempt_outcome
    direction: host-to-router
    transport: http
    method: POST
    path: /v1/outcomes
    request_contract: attempt_outcome
    response_contract: empty-204-or-error
    implementation: service/smart_router.go:FinishSmartRouterAttempt
    reporting_policy: one-shot-no-replay-on-rejected-or-unknown-write
  - name: fetch_signed_snapshot
    direction: host-to-router
    transport: http
    method: GET
    path: /v1/snapshot
    response_contract: signed_snapshot
    implementation: pkg/smartrouterhost/client.go:Client.Snapshot
    use: explicit-client-read-not-relay-hot-path
  - name: resolve_opaque_binding
    direction: host-internal
    transport: none
    input: binding_id
    output: host-owned-provider-configuration
    router_visibility: none
    implementation: service/smart_router.go:validateSmartRouterSend
    registry_grants_channel_authority: false
host_requirements:
  startup: main.go:service.ConfigureSmartRouter
  route_hook: service/channel_select.go:SelectSmartRouterChannel
  attempt_hook: controller/relay.go
  send_hook: relay/channel/api_request.go:BeforeSmartRouterSend
  authority: authenticated-token-group-model-and-live-channel-abilities
  transport: literal-loopback-http-no-proxy-no-redirect
  default_enabled: false
  optional_scope: NEWAPI_SMART_ROUTER_SCOPE
  scope_values: [all, registry]
  default_scope: all
  initial_enablement_scope: registry
  disabled_startup: no-other-router-setting-read
  registry_admission: exact-group-model-client-protocol-before-channel-filtering
  absent_tuple: permanent-original-selector-through-retries
  unavailable_registered_tuple: admitted-fail-closed-no-fallback
  managed_tuple: original-production-selector-and-source-diverse-retries
  managed_ownership_candidates: all-currently-eligible-including-unregistered-channels
  uncertain_admitted_ownership: fail-closed-no-sidecar-or-provider-call
  managed_eligibility_read: model.ListEligibleChannelIDs
  eligibility_read_errors: ability-query-bulk-channel-query-or-inconsistent-cache
  eligibility_failure_restoration: sticky-terminal-no-revival-or-scope-exclusion
  legacy_selector_read_errors: inherited-production-behavior-unchanged
  signed_plan_ownership: immutable-no-transfer-or-reorder
  pre_do_authority_change: terminal-no-provider-invocation-or-retry
  configuration_ownership: immutable-runtime-and-request
  verify_signatures: true
  reject_expired_routes_with_injected_clock: true
  enforce_max_attempts: 5
  terminal_outcomes:
    - auth_401
    - client_4xx
    - write_unknown
    - response_committed
  retryable_outcomes:
    - rate_limited_429
    - upstream_5xx
    - transport_pre_write
  honor_retry_after_ms: true
  maximum_retry_after_ms: 86400000
  invalid_retry_after_policy: fail-closed
  post_settlement_report_failure: no-duplicate-provider-call-charge-or-refund
permanent_exclusions:
  - explicit-channel-pins
  - selected-affinity
  - strict-sessions
  - auto-groups
  - app-task-plugin-requests
  - recovery-workers-and-eligible-recovery-parents
  - websocket
  - responses-compact
  - nonstandard-post-paths
  - task_bridge
